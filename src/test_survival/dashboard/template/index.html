<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test survival experiments</title><style>
:root{font-family:system-ui,sans-serif;color:#192736;background:#f5f7fa}body{max-width:1120px;margin:40px auto;padding:0 24px}h1{font-size:32px;margin:0 0 8px}p{line-height:1.5;color:#4c5d70}header{margin-bottom:32px}label{display:block;margin-top:20px}select{font:inherit;padding:8px;border:1px solid #b9c4d2;border-radius:6px;background:white}article{background:white;border:1px solid #dbe2ea;border-radius:12px;padding:24px;margin:24px 0}h2{margin:0 0 8px;font-size:23px}.meta{font-size:14px}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}.legend span{border-bottom:3px solid;padding-bottom:4px}svg{width:100%;height:auto;display:block}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;margin:16px 0}th,td{text-align:left;padding:10px;border-bottom:1px solid #e4e9ef}th{background:#f7f9fc}small{color:#627387}.empty{padding:16px;background:#f7f9fc}@media(max-width:600px){body{margin:24px auto;padding:0 12px}article{padding:16px}h1{font-size:27px}}
</style></head><body><header><h1>Test survival experiments</h1><p>Frozen tests across successive commits. Each curve uses its original denominator.</p><label>Experiment <select id="filter"><option value="all">All experiments</option></select></label></header><main id="experiments"></main><footer><small>Self-contained report · All data is embedded in this file.</small></footer><script id="data" type="application/json">__EXPERIMENT_DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),colors=['#2563eb','#dc2626','#059669','#9333ea','#d97706','#0891b2','#475569'];
const make=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};
const ns='http://www.w3.org/2000/svg',svgNode=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e};
const root=document.getElementById('experiments'),filter=document.getElementById('filter');
data.forEach((exp,index)=>{const opt=make('option',exp.title);opt.value=index;filter.append(opt)});
function render(){root.replaceChildren();data.forEach((exp,index)=>{if(filter.value!=='all'&&Number(filter.value)!==index)return;const card=make('article');card.append(make('h2',exp.title));const meta=make('p',`${exp.project} · ${exp.language} · anchor ${exp.anchor} · ${exp.commit_count} commits`);meta.className='meta';card.append(meta);const svg=svgNode('svg',{viewBox:'0 0 1000 360',role:'img','aria-label':`Survival curves for ${exp.title}`});const left=58,top=15,right=975,bottom=305;for(let n=0;n<=100;n+=20){const y=bottom-(bottom-top)*n/100;svg.append(svgNode('path',{d:`M ${left} ${y} H ${right}`,stroke:'#dfe5ed'}),svgNode('text',{x:48,y:y+5,'text-anchor':'end','font-size':13,fill:'#617185'},`${n}%`))}for(let n=0;n<=5;n++){const i=Math.round(exp.commit_count*n/5),x=left+(right-left)*n/5;svg.append(svgNode('text',{x,y:328,'text-anchor':'middle','font-size':13},i))}svg.append(svgNode('text',{x:500,y:352,'text-anchor':'middle','font-size':13},'Commit index'));const legend=make('div');legend.className='legend';Object.entries(exp.groups).forEach(([group,points],i)=>{const count=exp.denominators[group],color=colors[i%colors.length];const key=make('span',`${group} (n=${count}${count?'':'; unavailable'})`);key.style.borderColor=color;legend.append(key);if(!count)return;let d='';points.forEach((p,n)=>{const x=left+(right-left)*p.x/Math.max(1,exp.commit_count),y=bottom-(bottom-top)*p.alive/count;d+=n?` H ${x} V ${y}`:`M ${x} ${y}`});const curve=svgNode('path',{d,fill:'none',stroke:color,'stroke-width':2.5});curve.append(svgNode('title',{},`${group}: ${points.at(-1).alive}/${count} final survivors`));svg.append(curve)});card.append(svg,legend);card.append(make('h3','Changed-line coverage totals'));const wrap=make('div');wrap.className='scroll';const table=make('table'),head=make('tr');['Group','Denominator','Final survivors','Covered / executable','Coverage'].forEach(x=>head.append(make('th',x)));table.append(head);for(const[group,points]of Object.entries(exp.groups)){const row=make('tr'),c=exp.coverage[group];[group,exp.denominators[group],points.at(-1).alive,c?`${c.covered} / ${c.executable}`:'not measured',c?(c.executable?(100*c.covered/c.executable).toFixed(1)+'%':'n/a'):'not measured'].forEach(x=>row.append(make('td',x)));table.append(row)}wrap.append(table);card.append(wrap);root.append(card)})}filter.addEventListener('change',render);render();
</script></body></html>
